name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - scientific-rebuild

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --release

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.12'
          - '3.14'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and test tools
        run: python -m pip install --upgrade pip maturin pytest

      - name: Build wheel
        run: maturin build --release -i python

      - name: Install wheel
        run: python -m pip install target/wheels/*.whl

      - name: Run Python tests
        run: python -m pytest tests/ -v

      - name: KIN-GEN-2 and MET exporter tests with SciPy (only tests needing git-ignored public data may skip)
        run: |
          python -m pip install scipy
          python -m pytest tests/test_kin_gen_2.py tests/test_met_export.py -v -rs --junitxml=kin-gen-2-tests.xml
          python tests/check_junit_skips.py kin-gen-2-tests.xml test_real_structure_window_d1_d2 test_real_entries_chain_ligand

  viewer:
    name: Viewer tests (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install viewer dependencies (not core dependencies)
        run: python -m pip install --upgrade pip pytest -r apps/structpair_viewer/requirements.txt

      - name: Run viewer tests (missing dependencies fail instead of skipping)
        env:
          TOPOFOLD_REQUIRE_VIEWER_TESTS: '1'
        run: python -m pytest tests/test_structpair_viewer.py -v -rs

  adapters:
    name: Adapter tests with MDAnalysis (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install adapter dependencies (not core dependencies)
        run: python -m pip install --upgrade pip pytest -r python/topofold_inputs/requirements-adapter.txt

      - name: Run adapter and atom-extraction tests (missing MDAnalysis fails instead of skipping)
        env:
          TOPOFOLD_REQUIRE_MDANALYSIS_TESTS: '1'
        run: >-
          python -m pytest tests/test_ca_adapter.py tests/test_atom_adapter.py tests/test_kinase_geometry.py
          tests/test_kinase_roles.py tests/test_kinase_roles_structure.py tests/test_abl_myr_runner_mda.py tests/test_abl_myr_1a_audit.py
          tests/test_abl_myr_1b_check.py tests/test_abl_myr_1b_check_a1.py tests/test_abl_myr_1b_check_a2.py
          -v -rs --junitxml=adapter-tests.xml

      - name: Only tests needing git-ignored public structures may skip
        run: >-
          python tests/check_junit_skips.py adapter-tests.xml
          test_abl_descriptors_match_independent_kin_desc_1_values
          test_calpha_identical_to_ca_adapter_on_public_structure
          test_observed_chain_matches_independent_parser_on_kin_rob_1_panel
          test_real_gmx_

  audit-reproductions:
    name: Audit reproduction scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn

      - name: Run writhe audit reproduction
        run: python benchmarks/audit/writhe_check.py

      - name: Run circular-statistics audit reproduction
        run: python benchmarks/audit/bc_check.py

      - name: Run PMF audit reproduction
        run: python benchmarks/audit/barrier_check.py

      - name: Run fair-baseline audit reproduction
        run: python benchmarks/audit/fair_baseline.py
