[workspace]
resolver = "2"
members = [
    "crates/topofold-core",
    "crates/topofold-index",
    "crates/topofold-io",
    "crates/topofold-python",
]

[workspace.package]
version = "0.8.3"
edition = "2021"
authors = ["Artem Galukhin <artem.galukhin@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/artsensiva/TopoFold"
homepage = "https://github.com/artsensiva/TopoFold"
readme = "README.md"
rust-version = "1.80"

[workspace.dependencies]
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
thiserror = "2.0"
rand = "0.8"
approx = "0.5"
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
rayon = "1.10"
ndarray = "0.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
